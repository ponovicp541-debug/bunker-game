<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>КАРАНТИН: ДОЗОР</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #070a09;
            --panel: #101614;
            --green: #00ff66;
            --red: #ff2a55;
            --amber: #ffb700;
            --text: #d0e8dd;
        }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 14px;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
        }
        body::after {
            content: " "; display: block;
            position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            z-index: 10; pointer-events: none;
        }
        .hud {
            display: flex; justify-content: space-between;
            background: var(--panel); padding: 10px 12px;
            border: 1px solid #23362e; border-radius: 8px;
            font-weight: bold; font-size: 14px;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.08);
        }
        .peephole-wrapper {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; margin: 12px 0;
            background: radial-gradient(circle, #16241e 0%, #040605 85%);
            border: 2px solid #1f332a; border-radius: 16px;
            padding: 16px; text-align: center;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .peephole-lens {
            width: 110px; height: 110px;
            border-radius: 50%;
            border: 4px solid #284237;
            display: flex; align-items: center; justify-content: center;
            font-size: 58px; margin-bottom: 12px;
            background: radial-gradient(circle, #0e1c16 30%, #000 100%);
            box-shadow: inset 0 0 20px #000, 0 0 15px rgba(0, 255, 102, 0.15);
            animation: breathe 3.5s infinite ease-in-out;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        .visitor-name {
            color: var(--amber); font-weight: bold;
            font-size: 16px; margin-bottom: 6px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .visitor-desc {
            font-size: 13.5px; line-height: 1.4;
            min-height: 55px; max-width: 95%;
        }
        .scanner-box {
            width: 100%; background: rgba(0, 255, 102, 0.06);
            border-left: 3px solid var(--green);
            padding: 8px 10px; margin-top: 10px;
            font-size: 12.5px; text-align: left;
            min-height: 54px; border-radius: 0 6px 6px 0;
        }
        .log-toast {
            font-size: 12.5px; color: var(--amber);
            margin-bottom: 8px; min-height: 32px;
            display: flex; align-items: center; justify-content: center;
        }
        .controls { display: flex; flex-direction: column; gap: 10px; z-index: 20; }
        .row { display: flex; gap: 10px; }
        button {
            flex: 1; padding: 14px 10px;
            border: none; border-radius: 8px;
            font-family: inherit; font-weight: bold; font-size: 14px;
            cursor: pointer; transition: transform 0.1s, opacity 0.2s;
            color: #fff;
        }
        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.35; pointer-events: none; }
        .btn-scan {
            background: #172a22; border: 1px solid var(--green);
            color: var(--green);
        }
        .btn-allow { background: #007a3d; border: 1px solid #00ff80; }
        .btn-deny { background: #8a142d; border: 1px solid var(--red); }

        .overlay {
            position: absolute; inset: 0;
            background: rgba(5, 7, 6, 0.96);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 24px; text-align: center; z-index: 30;
        }
        .overlay h1 { font-size: 26px; margin-bottom: 10px; }
        .overlay p { font-size: 15px; line-height: 1.5; margin-bottom: 24px; color: #a5c2b5; }
    </style>
</head>
<body>

    <div class="hud">
        <div id="hud-night">🌙 1/5</div>
        <div id="hud-hp">❤️❤️❤️</div>
        <div id="hud-morale">🧠🧠🧠</div>
        <div id="hud-bat">🔋⚡⚡⚡</div>
    </div>

    <div class="peephole-wrapper" id="screen">
        <div class="log-toast" id="log-box">Камера дверного шлюза активна...</div>
        <div class="peephole-lens" id="avatar">👤</div>
        <div class="visitor-name" id="v-name">Неизвестный</div>
        <div class="visitor-desc" id="v-desc">Загрузка видеопотока...</div>
        <div class="scanner-box" id="scan-data">> БИО-СКАНЕР: Ожидание команды...</div>
    </div>

    <div class="controls">
        <div class="row">
            <button class="btn-scan" id="btn-eyes" onclick="scan('eyes')">👁 Глаза (-1⚡)</button>
            <button class="btn-scan" id="btn-pulse" onclick="scan('pulse')">💓 Пульс (-1⚡)</button>
        </div>
        <div class="row">
            <button class="btn-allow" onclick="decide(true)">🚪 ВПУСТИТЬ</button>
            <button class="btn-deny" onclick="decide(false)">🔫 ПРОГНАТЬ</button>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <h1 id="end-title">КОНЕЦ СМЕНЫ</h1>
        <p id="end-desc"></p>
        <button class="btn-scan" style="flex:0; width: 220px; padding:16px;" onclick="initGame()">🔄 НОВАЯ СМЕНА</button>
    </div>

<script>

        if (!tg.HapticFeedback) return;
        if (type === 'error' || type === 'success' || type === 'warning') {
            tg.HapticFeedback.notificationOccurred(type);
        } else {
            tg.HapticFeedback.impactOccurred(type);
        }
    }

        {

            eyes: "Щурится от прожектора камеры, реакция зрачков в норме.",
            pulse: "128 уд/мин (высокий стресс).",
            monster: false
        }
    ];

    let state = {};

    function initGame() {
        vibrate('light');
        const pool = [...VISITORS].sort(() => Math.random() - 0.5);
        state = {
            hp: 3, morale: 3, bat: 3, night: 1, maxNights: 5,
            pool: pool, current: pool[0], scanned: []
        };
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('log-box').innerText = "Камера дверного шлюза активна...";
        render();
    }

    function render() {
        document.getElementById('hud-night').innerText = `🌙 ${state.night}/${state.maxNights}`;
        document.getElementById('hud-hp').innerText = '❤️'.repeat(state.hp) || '💀';
        document.getElementById('hud-morale').innerText = '🧠'.repeat(state.morale) || '🌀';
        document.getElementById('hud-bat').innerText = '🔋' + ('⚡'.repeat(state.bat) || '0');
