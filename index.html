<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>БУНКЕР N7</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #070a09;
            --panel: #101614;
            --green: #00ff66;
            --red: #ff2a55;
            --amber: #ffb700;
            --text: #d0e8dd;
        }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 14px;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
        }
        body::after {
            content: " "; display: block;
            position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            z-index: 10; pointer-events: none;
        }
        .hud {
            display: flex; justify-content: space-between;
            background: var(--panel); padding: 10px 12px;
            border: 1px solid #23362e; border-radius: 8px;
            font-weight: bold; font-size: 14px;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.08);
        }
        .peephole-wrapper {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; margin: 12px 0;
            background: radial-gradient(circle, #16241e 0%, #040605 85%);
            border: 2px solid #1f332a; border-radius: 16px;
            padding: 16px; text-align: center;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .peephole-lens {
            width: 110px; height: 110px;
            border-radius: 50%;
            border: 4px solid #284237;
            display: flex; align-items: center; justify-content: center;
            font-size: 58px; margin-bottom: 12px;
            background: radial-gradient(circle, #0e1c16 30%, #000 100%);
            box-shadow: inset 0 0 20px #000, 0 0 15px rgba(0, 255, 102, 0.15);
            animation: breathe 3.5s infinite ease-in-out;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        .visitor-name {
            color: var(--amber); font-weight: bold;
            font-size: 16px; margin-bottom: 6px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .visitor-desc {
            font-size: 13.5px; line-height: 1.4;
            min-height: 55px; max-width: 95%;
        }
        .scanner-box {
            width: 100%; background: rgba(0, 255, 102, 0.06);
            border-left: 3px solid var(--green);
            padding: 8px 10px; margin-top: 10px;
            font-size: 12.5px; text-align: left;
            min-height: 54px; border-radius: 0 6px 6px 0;
        }
        .log-toast {
            font-size: 12.5px; color: var(--amber);
            margin-bottom: 8px; min-height: 32px;
            display: flex; align-items: center; justify-content: center;
        }
        .controls { display: flex; flex-direction: column; gap: 10px; z-index: 20; position: relative; }
        .row { display: flex; gap: 10px; }
        button {
            flex: 1; padding: 14px 10px;
            border: none; border-radius: 8px;
            font-family: inherit; font-weight: bold; font-size: 14px;
            cursor: pointer; transition: transform 0.1s, opacity 0.2s;
            color: #fff; touch-action: manipulation;
        }
        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.35; pointer-events: none; }
        .btn-scan { background: #172a22; border: 1px solid var(--green); color: var(--green); }
        .btn-allow { background: #007a3d; border: 1px solid #00ff80; }
        .btn-deny { background: #8a142d; border: 1px solid var(--red); }

        .overlay {
            position: fixed; inset: 0;
            background: rgba(5, 7, 6, 0.96);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 24px; text-align: center; z-index: 50;
        }
        .overlay h1 { font-size: 26px; margin-bottom: 10px; }
        .overlay p { font-size: 15px; line-height: 1.5; margin-bottom: 24px; color: #a5c2b5; }
    </style>
</head>
<body class="notranslate">

    <div class="hud">
        <div id="hud-night">🌙 1/5</div>
        <div id="hud-hp">❤️❤️❤️</div>
        <div id="hud-morale">🧠🧠🧠</div>
        <div id="hud-bat">🔋⚡⚡⚡</div>
    </div>

    <div class="peephole-wrapper" id="screen">
        <div class="log-toast" id="log-box">Камера дверного шлюза активна...</div>
        <div class="peephole-lens" id="avatar">🌧️</div>
        <div class="visitor-name" id="v-name">Девушка в дождевике</div>
        <div class="visitor-desc" id="v-desc">Руки сильно дрожат, умоляет пустить погреться хотя бы на час.</div>
        <div class="scanner-box" id="scan-data">&gt; БИО-СКАНЕР: Готов к проверке...</div>
    </div>

    <div class="controls">
        <div class="row">
            <button type="button" class="btn-scan" id="btn-eyes" onclick="window.scan('eyes')">👁 Глаза (-1⚡)</button>
            <button type="button" class="btn-scan" id="btn-pulse" onclick="window.scan('pulse')">💓 Пульс (-1⚡)</button>
        </div>
        <div class="row">
            <button type="button" class="btn-allow" onclick="window.decide(true)">🚪 ВПУСТИТЬ</button>
            <button type="button" class="btn-deny" onclick="window.decide(false)">🔫 ПРОГНАТЬ</button>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <h1 id="end-title">КОНЕЦ СМЕНЫ</h1>
        <p id="end-desc"></p>
        <button type="button" class="btn-scan" style="flex:0; width: 220px; padding:16px;" onclick="window.initGame()">🔄 НОВАЯ СМЕНА</button>
    </div>

<script>
    const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    if (tg) {
        try { tg.expand(); tg.ready(); } catch (e) {}
    }

    function vibrate(type) {
        try {
            if (!tg || !tg.HapticFeedback) return;
            if (type === 'error' || type === 'success' || type === 'warning') {
                tg.HapticFeedback.notificationOccurred(type);
            } else {
                tg.HapticFeedback.impactOccurred(type);
            }
        } catch (e) {}
    }

    const VISITORS = [
        {
            icon: "🌧️", name: "Девушка в дождевике",
            desc: "Руки сильно дрожат, умоляет пустить погреться хотя бы на час.",
            eyes: "Зрачки расширены во всю радужку, белки желтоватые.",
            pulse: "38 уд/мин (аномально низкий для паники).",
            monster: true
        },
        {
            icon: "📦", name: "Курьер с рюкзаком",
            desc: "Тяжело дышит, прижимает к груди пустую термосумку, оглядывается.",
            eyes: "Красные от лопнувших сосудов, бегающий испуганный взгляд.",
            pulse: "138 уд/мин (сильная тахикардия, выброс адреналина).",
            monster: false
        },
        {
            icon: "👴", name: "Сосед с 4 этажа",
            desc: "Стоит абсолютно неподвижно перед камерой и широко улыбается.",
            eyes: "Стеклянный взгляд. Не моргнул ни разу за 2 минуты.",
            pulse: "Пульс не читается. Датчик ловит низкочастотный гул.",
            monster: true
        },
        {
            icon: "🔦", name: "Подросток с фонариком",
            desc: "Разбитый фонарь мигает. Плачет и просит спрятать от кого-то в коридоре.",
            eyes: "Обычные карие глаза, зрачки нормально реагируют на свет.",
            pulse: "115 уд/мин (умеренный испуг).",
            monster: false
        },
        {
            icon: "🩺", name: "Женщина в халате врача",
            desc: "Говорит идеально ровным голосом, предлагает медикаменты в обмен на ночлег.",
            eyes: "Секундное вертикальное сужение зрачка при вспышке камеры.",
            pulse: "16 уд/мин (температура тела близка к комнатной).",
            monster: true
        },
        {
            icon: "🤕", name: "Парень в рваной худи",
            desc: "На щеке свежая ссадина, отчаянно стучит кулаком по обшивке двери.",
            eyes: "Щурится от прожектора камеры, реакция зрачков в норме.",
            pulse: "128 уд/мин (высокий стресс).",
            monster: false
        }
    ];

    let state = {};

    window.initGame = function() {
        vibrate('light');
        const pool = [...VISITORS].sort(() => Math.random() - 0.5);
        state = {
            hp: 3, morale: 3, bat: 3, night: 1, maxNights: 5,
            pool: pool, current: pool[0], scanned: []
        };
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('log-box').innerText = "Камера дверного шлюза активна...";
        render();
    };

    function render() {
        document.getElementById('hud-night').innerText = "🌙 " + state.night + "/" + state.maxNights;
        document.getElementById('hud-hp').innerText = '❤️'.repeat(state.hp) || '💀';
        document.getElementById('hud-morale').innerText = '🧠'.repeat(state.morale) || '🌀';
        document.getElementById('hud-bat').innerText = '🔋' + ('⚡'.repeat(state.bat) || '0');

        const v = state.current;
        document.getElementById('avatar').innerText = v.icon;
        document.getElementById('v-name').innerText = v.name;
        document.getElementById('v-desc').innerText = v.desc;

        let scanHtml = "";
        if (state.scanned.includes('eyes')) scanHtml += "<div>👁 <b>Глаза:</b> " + v.eyes + "</div>";
        if (state.scanned.includes('pulse')) scanHtml += "<div>💓 <b>Пульс:</b> " + v.pulse + "</div>";
        document.getElementById('scan-data').innerHTML = scanHtml || "&gt; БИО-СКАНЕР: Готов к проверке...";

        document.getElementById('btn-eyes').disabled = state.bat <= 0 || state.scanned.includes('eyes');
        document.getElementById('btn-pulse').disabled = state.bat <= 0 || state.scanned.includes('pulse');
    }

    window.scan = function(type) {
        if (state.bat <= 0 || state.scanned.includes(type)) return;
        vibrate('medium');
        state.bat--;
        state.scanned.push(type);
        render();
    };

    function flashScreen(color) {
        const scr = document.getElementById('screen');
        scr.style.borderColor = color;
        scr.style.boxShadow = "0 0 25px " + color;
        setTimeout(() => {
            scr.style.borderColor = '#1f332a';
            scr.style.boxShadow = 'none';
        }, 450);
    }

    window.decide = function(allow) {
        const v = state.current;
        let msg = "";

        if (allow) {
            if (v.monster) {
                state.hp--;
                vibrate('error');
                flashScreen('#ff2a55');
                msg = "🩸 ОШИБКА! Это был мимик. Он ранил тебя в шлюзе (-1 ❤️)";
            } else {
                state.bat = Math.min(3, state.bat + 1);
                vibrate('success');
                flashScreen('#00ff66');
                msg = "✅ Выживший спасен! Он поделился батарейкой (+1 ⚡)";
            }
        } else {
            if (v.monster) {
                vibrate('success');
                flashScreen('#00ff66');
                msg = "🔥 Точно! Тварь зашипела и уползла в вентиляцию.";
            } else {
                state.morale--;
                vibrate('warning');
                flashScreen('#ffb700');
                msg = "😨 Ты прогнал человека... Слышны крики в темноте (-1 🧠)";
            }
        }

        document.getElementById('log-box').innerText = msg;

        if (state.hp <= 0) return endGame("💀 ЗАЩИТА ПРОБИТА", "Ты впустил слишком много тварей в бункер. Дозор окончен.", "#ff2a55");
        if (state.morale <= 0) return endGame("🌀 ПОТЕРЯ РАССУДКА", "Чувство вины за погибших людей сломало тебя.", "#ffb700");
        if (state.night >= state.maxNights) return endGame("🌅 РАССВЕТ НАСТУПИЛ!", "Ты вычислил мимиков, спас людей и пережил эту смену!", "#00ff66");

        state.night++;
        state.current = state.pool[state.night - 1];
        state.scanned = [];
        render();
    };

    function endGame(title, desc, color) {
        const ov = document.getElementById('overlay');
        const h1 = document.getElementById('end-title');
        h1.innerText = title;
        h1.style.color = color;
        document.getElementById('end-desc').innerText = desc;
        ov.style.display = 'flex';
    }

    window.initGame();
</script>
</body>
</html>
